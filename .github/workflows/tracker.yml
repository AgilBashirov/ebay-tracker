name: Qiymet Izleme

on:
  schedule:
    # Hər saat başı yoxlama. GitHub cron "ən yaxşı cəhd" prinsipi ilə işləyir —
    # bəzi saatlar ötürülə bilər, sistem bunu özü kompensasiya edir.
    - cron: "7 * * * *"
    # Gündə bir dəfə sağlamlıq hesabatı
    - cron: "0 17 * * *"
  workflow_dispatch:
    inputs:
      batch_size:
        description: "Bu işləmədə neçə məhsul yoxlansın (boş buraxın = avtomatik)"
        required: false
        default: "auto"
      health:
        description: "Sağlamlıq hesabatını da göndər (Telegram)"
        required: false
        type: boolean
        default: false
      only_health:
        description: "YALNIZ hesabat göndər, məhsulları yoxlama"
        required: false
        type: boolean
        default: false

concurrency:
  group: tracker
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    if: github.event.inputs.only_health != 'true'
    timeout-minutes: 50

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Kitabxanaları quraşdır
        run: |
          pip install -r requirements.txt
          # Playwright yalnız birbaşa rejim üçün lazımdır. GitHub-da API rejimi
          # işlədiyi üçün quraşdırma alınmasa da işləmə davam etməlidir.
          playwright install chromium --with-deps || \
            echo "⚠️ Playwright quraşdırılmadı — API rejimi ilə davam edilir"

      - name: Yoxlamanı işə sal
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          SCRAPERAPI_KEY: ${{ secrets.SCRAPERAPI_KEY }}
          SCRAPINGBEE_KEY: ${{ secrets.SCRAPINGBEE_KEY }}
          SCRAPE_METHOD: ${{ vars.SCRAPE_METHOD || 'auto' }}
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          EBAY_MARKETPLACE: ${{ vars.EBAY_MARKETPLACE || 'EBAY_US' }}
          ALERT_ON_PRICE_RISE: ${{ vars.ALERT_ON_PRICE_RISE || '1' }}
          ALERT_ON_LOW_QTY: ${{ vars.ALERT_ON_LOW_QTY || '1' }}
          ALERT_ON_OUT_OF_STOCK: ${{ vars.ALERT_ON_OUT_OF_STOCK || '1' }}
          ALERT_ON_LOW_MARGIN: ${{ vars.ALERT_ON_LOW_MARGIN || '0' }}
          ALERT_ON_RESTOCK: ${{ vars.ALERT_ON_RESTOCK || '0' }}
          EBAY_FVF_PCT: ${{ vars.EBAY_FVF_PCT || '13.6' }}
          EBAY_AD_RATE_PCT: ${{ vars.EBAY_AD_RATE_PCT || '0' }}
          SALES_TAX_PCT: ${{ vars.SALES_TAX_PCT || '10' }}
          CHECK_INTERVAL_DAYS: ${{ vars.CHECK_INTERVAL_DAYS || '1' }}
          EBAY_REFRESH_DAYS: ${{ vars.EBAY_REFRESH_DAYS || '10' }}
          EBAY_LOW_QTY: ${{ vars.EBAY_LOW_QTY || '2' }}
          BATCH_SIZE: ${{ github.event.inputs.batch_size || vars.BATCH_SIZE || 'auto' }}
          MARGIN_ALERT_PCT: ${{ vars.MARGIN_ALERT_PCT || '15' }}
          PRICE_RISE_MIN_USD: ${{ vars.PRICE_RISE_MIN_USD || '0.50' }}
          PRICE_RISE_MIN_PCT: ${{ vars.PRICE_RISE_MIN_PCT || '2.0' }}
          EBAY_FEE_PCT: ${{ vars.EBAY_FEE_PCT || '13.25' }}
          TARGET_MARGIN_PCT: ${{ vars.TARGET_MARGIN_PCT || '0' }}
          EBAY_PRICE_SOURCE: ${{ vars.EBAY_PRICE_SOURCE || 'scrape' }}
          ALERT_ON_PRICE_DROP: ${{ vars.ALERT_ON_PRICE_DROP || '0' }}
          DELAY_MIN_SEC: ${{ vars.DELAY_MIN_SEC || '8' }}
          DELAY_MAX_SEC: ${{ vars.DELAY_MAX_SEC || '22' }}
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/src
        run: python src/main.py

  # Günün sonunda qısa sağlamlıq hesabatı
  health:
    runs-on: ubuntu-latest
    if: github.event.schedule == '0 17 * * *' || github.event.inputs.health == 'true' || github.event.inputs.only_health == 'true'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Kitabxanalar
        run: pip install -r requirements.txt
      - name: Hesabat göndər
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/src
        run: python src/report.py
